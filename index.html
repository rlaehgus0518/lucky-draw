<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미래상상마술쇼 랜덤 번호 소환기</title>
  <style>
    /* 전체 화면 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --night: #050718;
      --deep-space: #101234;
      --violet: #8c5cff;
      --pink: #ff5fd2;
      --cyan: #62f7ff;
      --silver: #eef8ff;
      --soft-text: #c9d3ff;
      --panel: rgba(13, 18, 48, 0.72);
      --line: rgba(98, 247, 255, 0.26);
    }

    body {
      min-height: 100vh;
      padding: 12px;
      color: var(--silver);
      font-family: "Segoe UI", "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(98, 247, 255, 0.28), transparent 32%),
        radial-gradient(circle at 12% 18%, rgba(255, 95, 210, 0.18), transparent 30%),
        radial-gradient(circle at 88% 75%, rgba(140, 92, 255, 0.26), transparent 34%),
        linear-gradient(145deg, #02030c 0%, #101238 48%, #060714 100%);
      overflow: hidden;
    }

    /* 은은하게 움직이는 별빛 배경 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.8) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(98, 247, 255, 0.55) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 95, 210, 0.45) 0 1px, transparent 1.5px);
      background-size: 120px 120px, 170px 170px, 220px 220px;
      opacity: 0.38;
      animation: starDrift 18s linear infinite;
    }

    body::after {
      opacity: 0.22;
      filter: blur(1px);
      animation-duration: 28s;
      animation-direction: reverse;
    }

    @keyframes starDrift {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-80px, 60px, 0);
      }
    }

    button,
    input {
      font: inherit;
    }

    .app-shell {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 24px);
      margin: 0 auto;
      padding: 0;
      overflow: hidden;
    }

    .summon-card,
    .history {
      border: 1px solid rgba(98, 247, 255, 0.34);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(21, 25, 67, 0.88), rgba(5, 7, 24, 0.94)),
        radial-gradient(circle at top, rgba(140, 92, 255, 0.2), transparent 48%);
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.68),
        0 0 42px rgba(98, 247, 255, 0.18),
        inset 0 0 34px rgba(255, 255, 255, 0.05);
    }

    .summon-card {
      width: min(600px, max(420px, calc(100vw - 760px)));
      padding: clamp(14px, 2vw, 24px);
      overflow: hidden;
      position: relative;
    }

    .summon-card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(238, 248, 255, 0.12);
      border-radius: 22px;
      pointer-events: none;
    }

    .summon-card::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -190px;
      top: -190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 95, 210, 0.28), transparent 68%);
      pointer-events: none;
    }

    .summon-card > * {
      position: relative;
      z-index: 1;
    }

    /* 화면 중앙 메인 카드 + 오른쪽 고정형 소환 기록 배치 */
    .app-shell,
    .main-center,
    .summon-card,
    .history-sidebar {
      position: relative;
      z-index: 1;
    }

    .main-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .history-sidebar {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: clamp(280px, 26vw, 340px);
      display: flex;
      flex-direction: column;
      min-width: 0;
      z-index: 2;
    }

    .header {
      margin-bottom: clamp(10px, 1.8vw, 16px);
      text-align: center;
    }

    .show-title {
      color: var(--silver);
      font-size: clamp(1.9rem, 5.4vw, 3.9rem);
      font-weight: 950;
      letter-spacing: 0;
      text-shadow:
        0 0 12px rgba(98, 247, 255, 0.74),
        0 0 34px rgba(140, 92, 255, 0.52),
        0 0 64px rgba(255, 95, 210, 0.34);
    }

    .show-subtitle {
      margin-top: 0;
      color: var(--cyan);
      font-size: clamp(1rem, 3vw, 1.55rem);
      font-weight: 900;
      text-shadow: 0 0 18px rgba(98, 247, 255, 0.64);
    }

    /* 입력 영역 */
    .controls {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) minmax(110px, 1fr) auto;
      align-items: end;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(16, 22, 58, 0.76), rgba(5, 8, 28, 0.62));
      box-shadow: inset 0 0 26px rgba(98, 247, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .field {
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #dfe9ff;
      font-size: 0.84rem;
      font-weight: 800;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(98, 247, 255, 0.38);
      border-radius: 14px;
      color: var(--silver);
      background: rgba(4, 7, 24, 0.92);
      outline: none;
      box-shadow:
        inset 0 0 18px rgba(98, 247, 255, 0.08),
        0 0 0 rgba(98, 247, 255, 0);
    }

    input[type="number"]:focus {
      border-color: var(--cyan);
      box-shadow:
        0 0 0 3px rgba(98, 247, 255, 0.14),
        0 0 22px rgba(98, 247, 255, 0.22),
        inset 0 0 18px rgba(98, 247, 255, 0.08);
    }

    .check-field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      margin-bottom: 0;
      padding: 0 4px 1px;
      color: #e9edff;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .check-field input {
      width: 20px;
      height: 20px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    /* 중앙 홀로그램 마법진 */
    .summon-stage {
      display: grid;
      place-items: center;
      min-height: clamp(220px, 31vw, 340px);
      margin-bottom: 10px;
    }

    .hologram-circle {
      position: relative;
      display: grid;
      place-items: center;
      width: min(70vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(238, 248, 255, 0.18) 0 12%, transparent 13%),
        radial-gradient(circle, rgba(98, 247, 255, 0.2) 0 34%, transparent 35%),
        radial-gradient(circle, rgba(140, 92, 255, 0.26) 0 56%, rgba(8, 12, 38, 0.78) 57% 100%);
      box-shadow:
        0 0 34px rgba(98, 247, 255, 0.46),
        0 0 90px rgba(140, 92, 255, 0.32),
        inset 0 0 40px rgba(238, 248, 255, 0.11);
      overflow: hidden;
    }

    .hologram-circle::before,
    .hologram-circle::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 2px solid rgba(98, 247, 255, 0.38);
      border-top-color: rgba(255, 95, 210, 0.82);
      border-bottom-color: rgba(238, 248, 255, 0.18);
      animation: ringSpin 9s linear infinite;
    }

    .hologram-circle::after {
      inset: 20%;
      border-style: dashed;
      border-color: rgba(255, 95, 210, 0.48);
      border-left-color: rgba(98, 247, 255, 0.9);
      animation-duration: 6s;
      animation-direction: reverse;
    }

    .magic-lines {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 49.6%, rgba(98, 247, 255, 0.28) 50%, transparent 50.4%),
        linear-gradient(0deg, transparent 49.6%, rgba(255, 95, 210, 0.24) 50%, transparent 50.4%);
      opacity: 0.72;
      animation: magicPulse 2.8s ease-in-out infinite;
    }

    .particles {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 2px, transparent 2.5px),
        radial-gradient(circle, rgba(98, 247, 255, 0.9) 0 2px, transparent 2.5px),
        radial-gradient(circle, rgba(255, 95, 210, 0.82) 0 2px, transparent 2.5px);
      background-size: 90px 90px, 120px 120px, 150px 150px;
      animation: particleFloat 8s linear infinite;
      opacity: 0.46;
    }

    @keyframes ringSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes magicPulse {
      50% {
        opacity: 0.36;
        transform: scale(0.96);
      }
    }

    @keyframes particleFloat {
      to {
        background-position: 110px -80px, -90px 120px, 70px 110px;
      }
    }

    .result-panel {
      position: relative;
      z-index: 1;
      width: 74%;
      padding: 16px 10px;
      border: 1px solid rgba(238, 248, 255, 0.2);
      border-radius: 28px;
      text-align: center;
      background: rgba(2, 5, 20, 0.52);
      box-shadow: inset 0 0 30px rgba(98, 247, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .result-label {
      margin-bottom: 6px;
      color: var(--soft-text);
      font-size: clamp(0.88rem, 2vw, 1rem);
      font-weight: 800;
    }

    .result-number {
      color: var(--silver);
      font-size: clamp(3.3rem, 13vw, 7.2rem);
      font-weight: 950;
      line-height: 1;
      text-shadow:
        0 0 12px rgba(98, 247, 255, 0.95),
        0 0 34px rgba(98, 247, 255, 0.64),
        0 0 62px rgba(255, 95, 210, 0.36);
      transition: transform 0.18s ease, filter 0.18s ease;
      user-select: none;
      word-break: keep-all;
    }

    .result-number.spinning {
      animation: numberFlicker 0.32s ease-in-out infinite alternate;
    }

    .result-number.revealed {
      animation: revealNumber 0.7s ease both;
    }

    /* 최종 번호 강조 효과 */
    .result-number.summon-highlight {
      animation: resultFlash 0.8s ease both;
    }

    .hologram-circle.active {
      box-shadow:
        0 0 48px rgba(98, 247, 255, 0.62),
        0 0 120px rgba(255, 95, 210, 0.38),
        inset 0 0 44px rgba(238, 248, 255, 0.14);
    }

    @keyframes numberFlicker {
      from {
        transform: translateY(0) scale(1);
        filter: brightness(1);
      }

      to {
        transform: translateY(-5px) scale(1.04);
        filter: brightness(1.28);
      }
    }

    @keyframes revealNumber {
      0% {
        transform: scale(0.86);
        filter: brightness(1);
      }

      55% {
        transform: scale(1.12);
        filter: brightness(1.5);
      }

      100% {
        transform: scale(1);
        filter: brightness(1.08);
      }
    }

    @keyframes resultFlash {
      0% {
        transform: scale(1);
        text-shadow:
          0 0 12px rgba(98, 247, 255, 0.95),
          0 0 34px rgba(98, 247, 255, 0.64),
          0 0 62px rgba(255, 95, 210, 0.36);
      }

      42% {
        transform: scale(1.15);
        text-shadow:
          0 0 16px rgba(255, 255, 255, 1),
          0 0 42px rgba(98, 247, 255, 0.95),
          0 0 78px rgba(255, 95, 210, 0.82),
          0 0 112px rgba(140, 92, 255, 0.64);
      }

      100% {
        transform: scale(1);
      }
    }

    .message {
      min-height: 30px;
      margin-bottom: 10px;
      color: #e6faff;
      text-align: center;
      font-weight: 850;
      opacity: 0;
      transform: translateY(8px);
    }

    .message.show {
      animation: messageIn 0.35s ease forwards;
    }

    .message.error {
      color: #ffc4ea;
    }

    @keyframes messageIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 추첨 완료 리액션 효과 */
    .reaction-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      overflow: visible;
      z-index: 3;
    }

    .summon-message {
      position: absolute;
      left: 50%;
      bottom: 16%;
      z-index: 4;
      padding: 8px 12px;
      border: 1px solid rgba(238, 248, 255, 0.3);
      border-radius: 999px;
      color: #f8fdff;
      font-size: clamp(0.8rem, 2vw, 0.96rem);
      font-weight: 900;
      white-space: nowrap;
      background: linear-gradient(135deg, rgba(8, 16, 48, 0.78), rgba(85, 37, 130, 0.62));
      box-shadow:
        0 0 18px rgba(98, 247, 255, 0.32),
        0 0 32px rgba(255, 95, 210, 0.24);
      opacity: 0;
      transform: translate(-50%, 10px) scale(0.94);
    }

    .summon-message.show {
      animation: summonMessageIn 1.45s ease both;
    }

    .hologram-circle.reaction-burst {
      animation: hologramBurst 1.15s ease both;
    }

    /* 마법 파티클 애니메이션 */
    .magic-particle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size, 7px);
      height: var(--size, 7px);
      border-radius: 50%;
      background: var(--color, #62f7ff);
      box-shadow:
        0 0 10px var(--color, #62f7ff),
        0 0 22px var(--color, #62f7ff);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.35);
      animation: magicParticleBurst 1.25s ease-out forwards;
      animation-delay: var(--delay, 0ms);
    }

    .magic-particle::after {
      content: "";
      position: absolute;
      inset: 42%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
    }

    @keyframes magicParticleBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.35);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.06);
      }
    }

    @keyframes summonMessageIn {
      0% {
        opacity: 0;
        transform: translate(-50%, 10px) scale(0.94);
      }

      18%, 72% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -8px) scale(0.98);
      }
    }

    @keyframes hologramBurst {
      0% {
        filter: brightness(1);
      }

      35% {
        filter: brightness(1.45);
        box-shadow:
          0 0 58px rgba(98, 247, 255, 0.78),
          0 0 130px rgba(255, 95, 210, 0.48),
          inset 0 0 52px rgba(238, 248, 255, 0.2);
      }

      100% {
        filter: brightness(1);
      }
    }

    /* 버튼 영역 */
    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 0;
    }

    .button {
      min-width: 160px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      color: #04101e;
      font-size: 0.94rem;
      font-weight: 950;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .button-primary {
      background: linear-gradient(135deg, #62f7ff 0%, #d783ff 48%, #ff5fd2 100%);
      box-shadow:
        0 0 24px rgba(98, 247, 255, 0.36),
        0 10px 24px rgba(255, 95, 210, 0.18);
    }

    .button-secondary {
      color: var(--silver);
      border: 1px solid rgba(238, 248, 255, 0.22);
      background: linear-gradient(135deg, rgba(30, 41, 91, 0.96), rgba(86, 50, 145, 0.92));
      box-shadow: 0 0 20px rgba(140, 92, 255, 0.2);
    }

    .button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow:
        0 0 32px rgba(98, 247, 255, 0.46),
        0 12px 30px rgba(255, 95, 210, 0.22);
    }

    .button:active:not(:disabled) {
      transform: translateY(3px);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.56;
    }

    /* 오른쪽 소환 기록 패널 */
    .history {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(16, 22, 58, 0.74), rgba(5, 8, 28, 0.64));
      box-shadow:
        0 0 28px rgba(98, 247, 255, 0.16),
        inset 0 0 24px rgba(98, 247, 255, 0.05);
      overflow: hidden;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      color: #e7fbff;
      font-weight: 950;
    }

    .history-count {
      color: var(--soft-text);
      font-size: 0.9rem;
    }

    .history-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      list-style: none;
    }

    .history-list li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(98, 247, 255, 0.13);
      animation: historyIn 0.28s ease both;
    }

    .history-list li:last-child {
      border-bottom: 0;
    }

    .round {
      color: #e8ecff;
      font-weight: 900;
    }

    .drawn-number {
      color: var(--cyan);
      font-weight: 950;
      text-shadow: 0 0 12px rgba(98, 247, 255, 0.46);
    }

    .empty {
      justify-content: center;
      color: rgba(238, 248, 255, 0.62);
      text-align: center;
    }

    @keyframes historyIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1180px) {
      body {
        overflow-y: auto;
        overflow-x: hidden;
      }

      .app-shell {
        display: grid;
        gap: 14px;
        min-height: calc(100vh - 24px);
        overflow: visible;
      }

      .main-center,
      .history-sidebar {
        position: relative;
        inset: auto;
        width: 100%;
      }

      .summon-card {
        width: min(100%, 600px);
        margin: 0 auto;
      }

      .history-sidebar {
        max-width: 600px;
        margin: 0 auto;
      }

      .history {
        min-height: 260px;
        max-height: 320px;
      }

      .history-list {
        max-height: 260px;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }

      .summon-card,
      .history {
        border-radius: 22px;
      }

      .controls {
        grid-template-columns: 1fr;
        padding: 14px;
      }

      .check-field {
        padding: 0;
      }

      .result-panel {
        width: 78%;
      }

      .button {
        width: 100%;
      }

      .history-list {
        max-height: 230px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="main-center" aria-label="마법 추첨 메인 영역">
      <div class="summon-card">
        <header class="header">
          <h1 class="show-title">미래상상마술쇼</h1>
          <p class="show-subtitle">랜덤 번호 소환기</p>
        </header>

        <section class="controls" aria-label="번호 소환 설정">
          <div class="field">
            <label for="minNumber">최소 번호</label>
            <input id="minNumber" type="number" value="1" inputmode="numeric">
          </div>

          <div class="field">
            <label for="maxNumber">최대 번호</label>
            <input id="maxNumber" type="number" value="100" inputmode="numeric">
          </div>

          <label class="check-field" for="excludeDrawn">
            <input id="excludeDrawn" type="checkbox">
            이미 나온 번호 제외
          </label>
        </section>

        <section class="summon-stage" aria-label="현재 소환 결과">
          <div class="hologram-circle" id="hologramCircle">
            <div class="magic-lines"></div>
            <div class="particles"></div>
            <div class="reaction-layer" id="reactionLayer" aria-hidden="true"></div>
            <div class="summon-message" id="summonMessage" aria-hidden="true">행운의 번호가 소환되었습니다!</div>
            <div class="result-panel">
              <p class="result-label">소환 결과</p>
              <div class="result-number" id="resultNumber" aria-live="polite">?</div>
            </div>
          </div>
        </section>

        <p class="message" id="message" aria-live="polite"></p>

        <section class="actions" aria-label="마법 버튼 영역">
          <button class="button button-primary" id="startButton" type="button">마법 추첨 시작</button>
          <button class="button button-secondary" id="resetButton" type="button">마법 기록 초기화</button>
        </section>
      </div>
    </section>

    <aside class="history-sidebar" aria-label="소환 기록 패널">
      <section class="history" aria-label="소환 기록">
        <div class="history-header">
          <span>소환 기록</span>
          <span class="history-count" id="historyCount">0번째 마법</span>
        </div>
        <ul class="history-list" id="historyList">
          <li class="empty">아직 소환된 번호가 없습니다.</li>
        </ul>
      </section>
    </aside>
  </main>

  <script>
    // localStorage 저장 이름입니다. 다른 이름으로 바꾸면 기존 저장 데이터와 분리됩니다.
    const STORAGE_KEY = "futureMagicNumberDrawState";

    // 숫자가 빠르게 바뀌는 속도와 전체 연출 시간을 조절합니다.
    const SPIN_INTERVAL = 42;
    const SPIN_DURATION = 2100;

    const minInput = document.getElementById("minNumber");
    const maxInput = document.getElementById("maxNumber");
    const excludeDrawnInput = document.getElementById("excludeDrawn");
    const resultNumber = document.getElementById("resultNumber");
    const hologramCircle = document.getElementById("hologramCircle");
    const reactionLayer = document.getElementById("reactionLayer");
    const summonMessage = document.getElementById("summonMessage");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const historyList = document.getElementById("historyList");
    const historyCount = document.getElementById("historyCount");

    let state = {
      min: 1,
      max: 100,
      activeMin: 1,
      activeMax: 100,
      excludeDrawn: false,
      history: [],
      drawnNumbers: []
    };

    let isDrawing = false;

    // 저장된 설정과 소환 기록을 불러옵니다.
    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        updateInputsFromState();
        renderHistory();
        return;
      }

      try {
        const parsed = JSON.parse(saved);
        const parsedMin = Number.isInteger(parsed.min) ? parsed.min : 1;
        const parsedMax = Number.isInteger(parsed.max) ? parsed.max : 100;

        state = {
          min: parsedMin,
          max: parsedMax,
          activeMin: Number.isInteger(parsed.activeMin) ? parsed.activeMin : parsedMin,
          activeMax: Number.isInteger(parsed.activeMax) ? parsed.activeMax : parsedMax,
          excludeDrawn: Boolean(parsed.excludeDrawn),
          history: Array.isArray(parsed.history) ? parsed.history : [],
          drawnNumbers: Array.isArray(parsed.drawnNumbers) ? parsed.drawnNumbers : []
        };
      } catch (error) {
        state = {
          min: 1,
          max: 100,
          activeMin: 1,
          activeMax: 100,
          excludeDrawn: false,
          history: [],
          drawnNumbers: []
        };
      }

      updateInputsFromState();
      renderHistory();

      if (state.history.length > 0) {
        const latest = state.history[state.history.length - 1].number;
        resultNumber.textContent = `✨ ${latest}번 ✨`;
      }
    }

    // 현재 설정과 기록을 브라우저 저장소에 저장합니다.
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // state 값을 입력 영역에 반영합니다.
    function updateInputsFromState() {
      minInput.value = state.min;
      maxInput.value = state.max;
      excludeDrawnInput.checked = state.excludeDrawn;
    }

    // 번호 범위가 올바른지 검사합니다.
    function validateRange() {
      const min = Number(minInput.value);
      const max = Number(maxInput.value);

      if (!Number.isInteger(min) || !Number.isInteger(max)) {
        return {
          valid: false,
          message: "최소 번호와 최대 번호는 정수로 입력해주세요."
        };
      }

      if (min > max) {
        return {
          valid: false,
          message: "최소 번호는 최대 번호보다 작거나 같아야 합니다."
        };
      }

      return {
        valid: true,
        min,
        max
      };
    }

    // min부터 max 사이의 랜덤 정수를 만듭니다.
    function getRandomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 중복 제외 설정에 따라 최종 소환 번호를 하나 뽑습니다.
    function drawNumber(min, max) {
      if (!state.excludeDrawn) {
        return getRandomNumber(min, max);
      }

      const drawnSet = new Set(state.drawnNumbers);
      const availableNumbers = [];

      for (let number = min; number <= max; number += 1) {
        if (!drawnSet.has(number)) {
          availableNumbers.push(number);
        }
      }

      if (availableNumbers.length === 0) {
        return null;
      }

      const randomIndex = getRandomNumber(0, availableNumbers.length - 1);
      return availableNumbers[randomIndex];
    }

    // 미래형 마법 장치가 작동하는 느낌으로 숫자를 빠르게 바꿉니다.
    function animateDraw(finalNumber, min, max) {
      return new Promise((resolve) => {
        clearSummonReaction();
        resultNumber.classList.remove("revealed", "summon-highlight");
        resultNumber.classList.add("spinning");
        hologramCircle.classList.add("active");

        const timer = setInterval(() => {
          resultNumber.textContent = getRandomNumber(min, max);
        }, SPIN_INTERVAL);

        setTimeout(() => {
          clearInterval(timer);
          resultNumber.textContent = `✨ ${finalNumber}번 ✨`;
          resultNumber.classList.remove("spinning");
          resultNumber.classList.add("revealed");
          hologramCircle.classList.remove("active");
          resolve();
        }, SPIN_DURATION);
      });
    }

    // 추첨 완료 순간의 축하 리액션을 한 번 실행합니다.
    function playSummonReaction() {
      clearSummonReaction();
      createMagicParticles();
      highlightResultNumber();
      showSummonMessage();
      hologramCircle.classList.add("reaction-burst");

      setTimeout(() => {
        hologramCircle.classList.remove("reaction-burst");
      }, 1200);
    }

    // 중앙 번호 주변에서 퍼지는 마법 파티클을 만듭니다.
    function createMagicParticles() {
      const colors = ["#62f7ff", "#8c5cff", "#ff5fd2", "#f8fdff"];
      const particleCount = 34;

      for (let index = 0; index < particleCount; index += 1) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * index) / particleCount;
        const distance = 82 + Math.random() * 96;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        const size = 4 + Math.random() * 5;
        const delay = Math.random() * 120;

        particle.className = "magic-particle";
        particle.style.setProperty("--x", `${x}px`);
        particle.style.setProperty("--y", `${y}px`);
        particle.style.setProperty("--size", `${size}px`);
        particle.style.setProperty("--delay", `${delay}ms`);
        particle.style.setProperty("--color", colors[index % colors.length]);
        reactionLayer.appendChild(particle);
      }

      setTimeout(() => {
        reactionLayer.innerHTML = "";
      }, 1600);
    }

    // 최종 번호에 잠깐 강한 네온 확대 효과를 적용합니다.
    function highlightResultNumber() {
      resultNumber.classList.remove("summon-highlight");
      void resultNumber.offsetWidth;
      resultNumber.classList.add("summon-highlight");

      setTimeout(() => {
        resultNumber.classList.remove("summon-highlight");
      }, 900);
    }

    // 짧은 소환 완료 문구를 홀로그램 위에 보여줍니다.
    function showSummonMessage() {
      summonMessage.classList.remove("show");
      void summonMessage.offsetWidth;
      summonMessage.classList.add("show");

      setTimeout(() => {
        summonMessage.classList.remove("show");
      }, 1500);
    }

    // 연속 추첨 시 이전 리액션 흔적을 정리합니다.
    function clearSummonReaction() {
      reactionLayer.innerHTML = "";
      summonMessage.classList.remove("show");
      hologramCircle.classList.remove("reaction-burst");
    }

    // 소환 결과를 기록에 추가합니다.
    function addHistory(number) {
      state.history.push({
        round: state.history.length + 1,
        number
      });

      if (!state.drawnNumbers.includes(number)) {
        state.drawnNumbers.push(number);
      }
    }

    // 기록과 중복 제외용 번호 목록을 함께 초기화합니다.
    function resetHistory() {
      state.history = [];
      state.drawnNumbers = [];
      clearSummonReaction();
      resultNumber.classList.remove("spinning", "revealed", "summon-highlight");
      resultNumber.textContent = "?";
      renderHistory();
      saveState();
    }

    // 소환 기록 목록을 화면에 표시합니다.
    function renderHistory() {
      historyList.innerHTML = "";
      historyCount.textContent = `${state.history.length}번째 마법`;

      if (state.history.length === 0) {
        historyList.innerHTML = '<li class="empty">아직 소환된 번호가 없습니다.</li>';
        return;
      }

      [...state.history].reverse().forEach((item) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <span class="round">${item.round}번째 마법</span>
          <span class="drawn-number">${item.number}번</span>
        `;
        historyList.appendChild(li);
      });
    }

    // 안내 또는 경고 문구를 애니메이션으로 보여줍니다.
    function showMessage(text, type = "info") {
      message.classList.remove("show", "error");
      message.textContent = text;

      if (type === "error") {
        message.classList.add("error");
      }

      void message.offsetWidth;
      message.classList.add("show");
    }

    // 범위가 바뀐 상태에서 추첨하려 할 때 기록 초기화를 확인합니다.
    function confirmRangeChangeIfNeeded(nextMin, nextMax) {
      const rangeChanged = nextMin !== state.activeMin || nextMax !== state.activeMax;

      if (!rangeChanged) {
        return true;
      }

      const confirmed = confirm("번호 범위가 변경되었습니다. 기존 마법 기록을 초기화하고 새 범위로 추첨할까요?");

      if (!confirmed) {
        return false;
      }

      state.min = nextMin;
      state.max = nextMax;
      state.activeMin = nextMin;
      state.activeMax = nextMax;
      resetHistory();
      return true;
    }

    // 추첨 시작 버튼을 눌렀을 때 실행되는 전체 흐름입니다.
    async function handleStart() {
      if (isDrawing) {
        return;
      }

      const range = validateRange();

      if (!range.valid) {
        showMessage(range.message, "error");
        return;
      }

      if (!confirmRangeChangeIfNeeded(range.min, range.max)) {
        showMessage("마법 추첨이 취소되었습니다.");
        updateInputsFromState();
        return;
      }

      state.min = range.min;
      state.max = range.max;
      state.activeMin = range.min;
      state.activeMax = range.max;
      state.excludeDrawn = excludeDrawnInput.checked;

      const finalNumber = drawNumber(state.min, state.max);

      if (finalNumber === null) {
        showMessage("모든 번호가 소환되었습니다. 기록을 초기화하거나 번호 범위를 다시 설정해주세요.", "error");
        saveState();
        return;
      }

      isDrawing = true;
      startButton.disabled = true;
      resetButton.disabled = true;
      showMessage("홀로그램 마법진이 행운의 번호를 찾고 있습니다...");

      await animateDraw(finalNumber, state.min, state.max);
      playSummonReaction();

      addHistory(finalNumber);
      renderHistory();
      saveState();
      showMessage(`${finalNumber}번이 소환되었습니다.`);

      isDrawing = false;
      startButton.disabled = false;
      resetButton.disabled = false;
    }

    // 입력값과 체크 상태를 저장하되, 기록 초기화는 추첨 시작 시 확인 후 처리합니다.
    function handleSettingChange() {
      const min = Number(minInput.value);
      const max = Number(maxInput.value);

      if (Number.isInteger(min)) {
        state.min = min;
      }

      if (Number.isInteger(max)) {
        state.max = max;
      }

      state.excludeDrawn = excludeDrawnInput.checked;
      saveState();
    }

    startButton.addEventListener("click", handleStart);
    resetButton.addEventListener("click", () => {
      if (isDrawing) {
        return;
      }

      if (confirm("저장된 마법 추첨 기록을 모두 삭제할까요?")) {
        resetHistory();
        showMessage("마법 추첨 기록이 초기화되었습니다.");
      }
    });

    excludeDrawnInput.addEventListener("change", handleSettingChange);
    minInput.addEventListener("change", handleSettingChange);
    maxInput.addEventListener("change", handleSettingChange);
    minInput.addEventListener("input", handleSettingChange);
    maxInput.addEventListener("input", handleSettingChange);

    loadState();
  </script>
</body>
</html>
